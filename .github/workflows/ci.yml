name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore .\tests\RengaMcp.Tests\RengaMcp.Tests.csproj
      - name: Build
        run: dotnet build .\src\RengaMcp.Server\RengaMcp.Server.csproj -c Release --no-restore
      - name: Test
        run: dotnet test .\tests\RengaMcp.Tests\RengaMcp.Tests.csproj -c Release --no-restore
